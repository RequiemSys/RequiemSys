<div class="page-container">
  <div class="back-button">
    <button type="button" [routerLink]="['/main/exhumation']">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </button>
  </div>

  <div class="registro-container">
    <div class="registro-card registro-card--wide">
      <div class="logo">
        <h1>Editar Exumação</h1>
        <p>Atualize os dados do falecido para exumação.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="registro-form">
        <div class="section-title">Dados do Falecido</div>

        <div class="cadastro-grid">
          <div class="form-group grid-full">
            <label for="nome_completo">Nome Completo</label>
            <input id="nome_completo" type="text" formControlName="nome_completo" class="form-control" [placeholder]="exhumation?.nome_completo || ''" />
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input id="cpf" type="text" formControlName="cpf" class="form-control" [placeholder]="exhumation?.cpf || ''" />
          </div>

          <div class="form-group">
            <label for="sexo">Sexo</label>
            <select id="sexo" formControlName="sexo" class="form-control">
              <option value="">Selecione</option>
              <option value="M">Masculino</option>
              <option value="F">Feminino</option>
              <option value="O">Outro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="data_nascimento">Data de Nascimento</label>
            <input id="data_nascimento" type="date" formControlName="data_nascimento" class="form-control" />
          </div>

          <div class="form-group">
            <label for="data_falecimento">Data de Falecimento</label>
            <input id="data_falecimento" type="date" formControlName="data_falecimento" class="form-control" />
          </div>

          <div class="form-group">
            <label for="estado_civil">Estado Civil</label>
            <select id="estado_civil" formControlName="estado_civil" class="form-control">
              <option value="">Selecione</option>
              <option value="Solteiro">Solteiro</option>
              <option value="Casado">Casado</option>
              <option value="Divorciado">Divorciado</option>
              <option value="Viúvo">Viúvo</option>
            </select>
          </div>

          <div class="form-group">
            <label for="naturalidade">Naturalidade</label>
            <input id="naturalidade" type="text" formControlName="naturalidade" class="form-control" [placeholder]="exhumation?.naturalidade || ''" />
          </div>

          <div class="form-group">
            <label for="nacionalidade">Nacionalidade</label>
            <input id="nacionalidade" type="text" formControlName="nacionalidade" class="form-control" [placeholder]="exhumation?.nacionalidade || ''" />
          </div>

          <div class="form-group">
            <label for="nome_mae">Nome da Mãe</label>
            <input id="nome_mae" type="text" formControlName="nome_mae" class="form-control" [placeholder]="exhumation?.nome_mae || ''" />
          </div>

          <div class="form-group">
            <label for="nome_pai">Nome do Pai</label>
            <input id="nome_pai" type="text" formControlName="nome_pai" class="form-control" [placeholder]="exhumation?.nome_pai || ''" />
          </div>

          <div class="form-group">
            <label for="causa_morte">Causa da Morte</label>
            <input id="causa_morte" type="text" formControlName="causa_morte" class="form-control" [placeholder]="exhumation?.causa_morte || ''" />
          </div>

          <div class="form-group">
            <label for="num_declaracao_obito">Nº Declaração de Óbito</label>
            <input id="num_declaracao_obito" type="text" formControlName="num_declaracao_obito" class="form-control" [placeholder]="exhumation?.num_declaracao_obito || ''" />
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" formControlName="status" class="form-control">
              <option value="">Selecione</option>
              <option *ngFor="let option of statusOptions" [value]="option">{{ option }}</option>
            </select>
          </div>

          <div class="form-group grid-full">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" formControlName="observacoes" class="form-control textarea-control" [placeholder]="exhumation?.observacoes || ''"></textarea>
          </div>
        </div>

        <div *ngIf="submitError()" class="form-error">
          {{ submitError() }}
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secundario" [routerLink]="['/main/exhumation']">Cancelar</button>
          <button type="submit" class="btn-registro" [disabled]="submitting()">
            {{ submitting() ? 'Atualizando...' : 'Atualizar Exumação' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
