<div class="page-container">

  <div class="back-button">
    <button type="button" [routerLink]="['/main/burial']">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </button>
  </div>

  <div class="registro-container">

    <div class="registro-card registro-card--wide">

      <div class="logo">
        <h1>Novo Cadastro de Sepultamento</h1>
        <p>Preencha os dados do sepultamento</p>
      </div>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="registro-form"
      >

        <div class="section-title">
          Dados do Sepultamento
        </div>

        <div class="cadastro-grid">
          <div class="form-group">
            <label for="falecido">
              Falecido
              <span class="req">*</span>
            </label>

            <input
              id="falecido"
              type="text"
              formControlName="falecido"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="data_sepultamento">
              Data do Sepultamento
              <span class="req">*</span>
            </label>

            <input
              id="data_sepultamento"
              type="date"
              formControlName="data_sepultamento"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="horario">
              Horário
              <span class="req">*</span>
            </label>

            <input
              id="horario"
              type="time"
              formControlName="horario"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="unidade_sepultamento">
              Unidade de Sepultamento
              <span class="req">*</span>
            </label>

            <select
              id="unidade_sepultamento"
              formControlName="unidade_sepultamento"
              class="form-control"
            >

            <option value="" disabled selected>
              Selecione
            </option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>

            </select>
          </div>

          <div class="form-group">
            <label for="responsavel">
              Responsável
              <span class="req">*</span>
            </label>

            <input
              id="responsavel"
              type="text"
              formControlName="responsavel"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="status">
              Status
              <span class="req">*</span>
            </label>

            <select
              id="status"
              formControlName="status"
              class="form-control"
            >
              <option value="Pendente">
                Pendente
              </option>

              <option value="Concluído">
                Concluído
              </option>

              <option value="Cancelado">
                Cancelado
              </option>
            </select>
          </div>

          <div class="form-group grid-full">
            <label for="observacoes">
              Observações
            </label>

            <textarea
              id="observacoes"
              formControlName="observacoes"
              class="form-control textarea-control"
            ></textarea>
          </div>
        </div>

        @if (submitError()) {
          <p class="form-error">
            {{ submitError() }}
          </p>
        }

        <div class="form-actions">

          <button
            type="button"
            class="btn-secundario"
            [routerLink]="['/main/burial']"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-registro"
            [disabled]="form.invalid || submitting()"
          >
            {{ submitting() ? 'Cadastrando...' : 'Cadastrar' }}
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
