<div class="page-container">

  <div class="back-button">
    <button type="button" [routerLink]="['/main/burial-unit']">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </button>
  </div>

  <div class="registro-container">

    <div class="registro-card registro-card--wide">

      <div class="logo">
        <h1>Nova Unidade de Sepultamento</h1>
        <p>Preencha os dados do jazigo</p>
      </div>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="registro-form"
      >

        <div class="section-title">
          Dados do Jazigo
        </div>

        <div class="cadastro-grid">

          <div class="form-group">
            <label for="tipo">
              Tipo de Jazigo
              <span class="req">*</span>
            </label>

            <select
              id="tipo"
              formControlName="tipo"
              class="form-control"
            >
              <option value="" disabled selected hidden>
                Selecione
              </option>

              @for (tipo of typeOptions; track tipo) {
                <option [value]="tipo">{{ tipo }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="codigo">
              Código
              <span class="req">*</span>
            </label>

            <input
              id="codigo"
              type="text"
              formControlName="codigo"
              class="form-control"
              placeholder="Ex: 03A"
            />
          </div>

          <div class="form-group">
            <label for="localizacao">
              Localização
              <span class="req">*</span>
            </label>

            <select
              id="localizacao"
              formControlName="localizacao"
              class="form-control"
            >
              <option value="" disabled selected hidden>
                Selecione
              </option>

              @for (local of locationOptions; track local) {
                <option [value]="local">{{ local }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="status">
              Status
              <span class="req">*</span>
            </label>

            <select
              id="status"
              formControlName="status"
              class="form-control"
            >
              @for (item of statusOptions; track item.value) {
                <option [value]="item.value">{{ item.label }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="periodoConcessivo">
              Período Concessivo
              <span class="req">*</span>
            </label>
            
            <div class="datepicker-wrapper" style="position: relative; display: flex; align-items: center;">
              <input
                id="periodoConcessivo"
                [matDatepicker]="picker"
                formControlName="periodoConcessivo"
                class="form-control"
                placeholder="DD/MM/AAAA"
              />
              <mat-datepicker-toggle 
                matSuffix 
                [for]="picker"
                style="position: absolute; right: 8px;"
              ></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </div>
          </div>

          <div class="form-group hidden-on-mobile"></div>

          <div class="form-group grid-full">
            <label for="observacoes">
              Observações
            </label>

            <textarea
              id="observacoes"
              formControlName="observacoes"
              class="form-control textarea-control"
              placeholder="Observações adicionais"
            ></textarea>
          </div>

        </div>

        @if (submitError()) {
          <p class="form-error">{{ submitError() }}</p>
        }

        <div class="form-actions">

          <button
            type="button"
            class="btn-secundario"
            [routerLink]="['/main/burial-unit']"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-registro"
            [disabled]="form.invalid || submitting()"
          >
            {{ submitting() ? 'Cadastrando...' : 'Cadastrar' }}
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
