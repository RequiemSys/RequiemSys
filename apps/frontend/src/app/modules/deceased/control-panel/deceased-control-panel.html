<div class="control-panel">
  <div class="panel-actions">
    <button mat-raised-button color="primary" (click)="onCreateNew()">
      <mat-icon>add</mat-icon>
      Criar Novo Falecido
    </button>
    <button mat-icon-button matTooltip="Atualizar" (click)="onRefresh()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <app-shared-table
    [title]="title"
    [subtitle]="subtitle"
    [columns]="columns"
    [data]="deceased"
    [customCellTemplate]="jazigoTemplate"
    (view)="onView($event)"
    (delete)="onDelete($event)"
  ></app-shared-table>

  <!-- Template para o jazigo -->
  <ng-template #jazigoTemplate let-item>
    <span class="jazigo-link" (click)="onViewJazigo(item.jazigo)">
      {{ item.jazigo?.identificacao || item.jazigo?.nome || item.jazigo || 'Não informado' }}
    </span>
  </ng-template>
</div>
